<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNOルールメーカー</title>

    <style>
        .settingArea {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            display: none;
        }

        .settingArea div {
            margin: 10px;
        }

        .settingArea input {
            width: 60px;
            font-size: 18px;
            text-align: center;
        }

        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 40px;
            font-size: 16px;
            transition: background-color 0.5s;
        }

        h1 {
            color: #e74c3c;
            font-size: 32px;
        }

        button {
            font-size: 20px;
            padding: 12px 20px;
            margin: 8px;
            border-radius: 12px;

            color: white;
            background-color: #3498db;

            font-weight: bold;
        }

	.settingButton {
    	    background-color: #6c757d;
    	    color: white;
	}

        .gameCount {
            font-size: 24px;
            margin: 10px;
            font-weight: bold;
        }

        .bonusInfo {
            font-size: 20px;
            margin-bottom: 20px;
            color: #555;
        }

        .result {
            font-size: 24px;
            line-height: 1.8;
            margin-top: 10px;
        }

        .bonus {
            color: #D4AF37;
            font-weight: bold;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .chanceBonus {
            font-size: 28px;
            color: red;
            font-weight: bold;
        }

        .footer {
            margin-top: 40px;
            color: #888;
            font-size: 12px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h1>UNOルールメーカー</h1>

    <div class="gameCount" id="gameCount">
        現在 第1ゲーム
    </div>

    <div class="bonusInfo" id="bonusInfo"></div>

    <button onclick="drawRule()">
        ルール抽選
    </button>

    <button onclick="nextGame()">
        次ゲームへ
    </button>

    <button onclick="resetGame()">
        リセット
    </button>

    <button class="settingButton" onclick="toggleSetting()">
        設定
    </button>

    <div class="settingArea" id="settingArea">

        <h3>抽選確率設定</h3>

        <div>
            ドロー2返し有り
            <input id="draw2Rate" type="number" min="0" max="100">
            %
        </div>

        <div>
            上がりカードなんでもOK
            <input id="finishRate" type="number" min="0" max="100">
            %
        </div>

        <div>
            複数枚出しOK
            <input id="multiRate" type="number" min="0" max="100">
            %
        </div>

        <div>
            BONUS時 2倍確率
            <input id="chance2Rate" type="number" min="0" max="100">
            %
        </div>

        <button onclick="saveSetting()">
            保存
        </button>

    </div>

    <div class="result" id="result">
        ボタンを押してください
    </div>

    <script>

        let gameNumber = 1;

        function toggleSetting() {
            const area = document.getElementById("settingArea");

            if (area.style.display === "block") {
                area.style.display = "none";
            } else {
                area.style.display = "block";
            }
        }

	function saveSetting() {

    	localStorage.setItem(
        "draw2Rate",
        document.getElementById("draw2Rate").value
    	);

    	localStorage.setItem(
        "finishRate",
        document.getElementById("finishRate").value
    	);

    	localStorage.setItem(
        "multiRate",
        document.getElementById("multiRate").value
    	);

    	localStorage.setItem(
        "chance2Rate",
        document.getElementById("chance2Rate").value
    	);

    	document.getElementById("settingArea").style.display =
        "none";

	document.getElementById("settingArea").style.display =
    	"none";

	document.getElementById("result").innerHTML =
    	"✅ 設定を保存しました";

}

        function loadSetting() {

            document.getElementById("draw2Rate").value =
                localStorage.getItem("draw2Rate") || 50;

            document.getElementById("finishRate").value =
                localStorage.getItem("finishRate") || 70;

            document.getElementById("multiRate").value =
                localStorage.getItem("multiRate") || 60;

            document.getElementById("chance2Rate").value =
                localStorage.getItem("chance2Rate") || 60;
        }

        function updateBonusInfo() {

            if (gameNumber % 5 === 0) {

                document.getElementById("bonusInfo").innerHTML =
                    "🔥 BONUS GAME 🔥";

                document.body.style.backgroundColor =
                    "#FFF3CD";

            } else {

                let remain = 5 - (gameNumber % 5);

                document.getElementById("bonusInfo").innerHTML =
                    `次回BONUS GAMEまであと${remain}ゲーム`;

                document.body.style.backgroundColor =
                    "white";
            }
        }

        function nextGame() {

            gameNumber++;

            document.getElementById("gameCount").innerHTML =
                `現在 第${gameNumber}ゲーム`;

            updateBonusInfo();
        }

        function drawRule() {

            document.getElementById("result").innerHTML =
                "🎲 抽選中...";

            setTimeout(function () {

                const isBonusGame =
                    gameNumber % 5 === 0;

                const draw2Rate =
                    Number(document.getElementById("draw2Rate").value);

                const finishRate =
                    Number(document.getElementById("finishRate").value);

                const multiRate =
                    Number(document.getElementById("multiRate").value);

                let draw2 =
                    Math.random() < draw2Rate / 100
                        ? "〇"
                        : "×";

                let finish =
                    Math.random() < finishRate / 100
                        ? "なんでもOK"
                        : "数字のみ";

                let multi =
                    Math.random() < multiRate / 100
                        ? "〇"
                        : "×";

                let chance = "なし";

                if (isBonusGame) {

                    let r = Math.random();

                    const chance2Rate =
                        Number(document.getElementById("chance2Rate").value);

                    if (r < chance2Rate / 100) {
                        chance = "2倍";
                    } else {
                        chance = "3倍";
                    }
                }

                let bonusText = "";

                if (isBonusGame) {
                    bonusText =
                        "<div class='bonus'>🔥 BONUS GAME 🔥</div>";
                }

                let chanceDisplay;

                if (isBonusGame) {

                    chanceDisplay =
                        `<span class='chanceBonus'>${chance}</span>`;

                } else {

                    chanceDisplay = chance;
                }

                document.getElementById("result").innerHTML =
                    `
                    ${bonusText}

                    <b>今回のルール</b>
                    <br>

                    ドロー2返し：${draw2}
                    <br>

                    上がりカード：${finish}
                    <br>

                    複数枚出し：${multi}
                    <br>

                    ポイント倍率：
		    ${chanceDisplay}
                    `;
            }, 1000);
        }

	function resetGame() {

    gameNumber = 1;

    document.getElementById("gameCount").innerHTML =
        `現在 第${gameNumber}ゲーム`;

    document.getElementById("result").innerHTML =
        "ボタンを押してください";

    updateBonusInfo();
}
    window.onload = function () {

    loadSetting();
    updateBonusInfo();

};
    </script>

<div class="footer">
　UNO Rule Maker<br>
　Version 2.0<br>
　© 2026 Naoki,Joji Kojima
</div>

</body>

</html>
