<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNOルールメーカー</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 40px;
                  font-size:16px;
            transition: background-color 0.5s;
        }

        h1 {
            color: #e74c3c;
            font-size: 32px;
        }

        button {
            font-size: 14px;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 10px;
        }

        .gameCount {
            font-size: 24px;
            margin: 10px;
            font-weight: bold;
        }

        .bonusInfo {
            font-size: 20px;
            margin-bottom: 20px;
            color: #555;
        }

        .result {
            font-size: 24px;
            line-height: 1.8;
            margin-top: 10px;
        }

        .bonus {
            color: #D4AF37;
            font-weight: bold;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .chanceBonus {
            font-size: 28px;
            color: red;
            font-weight: bold;
        }

              .footer {
               margin-top: 40px;
            color: #888;
            font-size: 12px;
            line-height: 1.8;
              }

    </style>
</head>

<body>

    <h1>UNOルールメーカー</h1>

    <div class="gameCount" id="gameCount">
        現在 第1ゲーム
    </div>

    <div class="bonusInfo" id="bonusInfo">
    </div>

    <button onclick="drawRule()">
        ルール抽選
    </button>

    <button onclick="nextGame()">
        次ゲームへ
    </button>

    <button onclick="resetGame()">
        リセット
    </button>

    <div class="result" id="result">
        ボタンを押してください
    </div>

    <script>

        let gameNumber = 1;

        updateBonusInfo();

        function updateBonusInfo() {

            if (gameNumber % 5 === 0) {

                document.getElementById("bonusInfo").innerHTML =
                    "🔥 BONUS GAME 🔥";

                document.body.style.backgroundColor =
                    "#FFF3CD";

            } else {

                let remain = 5 - (gameNumber % 5);

                document.getElementById("bonusInfo").innerHTML =
                    `次回BONUS GAMEまであと${remain}ゲーム`;

                document.body.style.backgroundColor =
                    "white";
            }
        }

        function nextGame() {

            gameNumber++;

            document.getElementById("gameCount").innerHTML =
                `現在 第${gameNumber}ゲーム`;

            updateBonusInfo();
        }

        function drawRule() {

            document.getElementById("result").innerHTML =
                "🎲 抽選中...";

            setTimeout(function () {

                const isBonusGame =
                    gameNumber % 5 === 0;

                let draw2 =
                    Math.random() < 0.5
                    ? "あり"
                    : "なし";

                let finish =
                    Math.random() < 0.7
                    ? "なんでもOK"
                    : "数字のみ";

                let multi =
                    Math.random() < 0.6
                    ? "あり"
                    : "なし";

                let chance = "なし";

                if (isBonusGame) {

                    let r = Math.random();

                    if (r < 0.6) {
                        chance = "2倍";
                    } else {
                        chance = "3倍";
                    }
                }

                let bonusText = "";

                if (isBonusGame) {
                    bonusText =
                        "<div class='bonus'>🔥 BONUS GAME 🔥</div>";
                }

                let chanceDisplay;

                if (isBonusGame) {

                    chanceDisplay =
                        `<div class='chanceBonus'>${chance}</div>`;

                } else {

                    chanceDisplay = chance;

                }

                document.getElementById("result").innerHTML =
                    `
                    ${bonusText}

                    <b>今回のルール</b>
                    <br>

                    ドロー2返し：${draw2}
                    <br>

                    上がりカード：${finish}
                    <br>

                    複数枚出し：${multi}
                    <br>

                    チャンスタイム：
                    ${chanceDisplay}
                    `;
            }, 1000);
        }

	function resetGame() {

    gameNumber = 1;

    document.getElementById("gameCount").innerHTML =
        `現在 第${gameNumber}ゲーム`;

    document.getElementById("result").innerHTML =
        "ボタンを押してください";

    updateBonusInfo();
}
    </script>

<div class="footer">
　UNO Rule Maker<br>
　Version 1.6<br>
　© 2026 Naoki,Joji Kojima
</div>

</body>

</html>
